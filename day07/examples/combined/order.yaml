groups:
  - id: span.order.create
    type: span
    span_kind: server
    brief: "建立訂單的 Span"
    stability: development
    attributes:
      - ref: deployment.environment
      - id: user_id
        type: string
        brief: "下單使用者的識別碼"
        examples: ["u-5"]
        requirement_level: required
        stability: development

  - id: metric.app.orders.count
    type: metric
    metric_name: app.orders.count
    instrument: counter
    unit: "{order}"
    brief: "訂單建立總數"
    stability: development
    attributes:
      - ref: app.outcome
