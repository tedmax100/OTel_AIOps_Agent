# Signal declaration OWNED by payment-service (ARE: ownership/criticality is the
# service team's schema, not a central wiki page). Compiled into the agent's
# app/signals/{topology,contracts}.yaml by `python -m app.signals.compile` —
# edit THIS file, never the generated aggregates. SLI metric names are the
# service's emitted Prometheus names (also declared in the Weaver registry).
service: payment-service
role: "charges; has the payment_use_new_validator flag"
tier: 1
journeys: [checkout]
git_version: v2.4.1
freshness_seconds: 60
supported_decisions: [rca, deploy-correlation]
slis:
  - kind: error
    # `or vector(0)` makes the numerator 0 (not empty) when there are no
    # declines; clamp_min keeps the denominator ≥1 → a well-defined 0.0.
    promql: '(sum(rate(payment_charges_total{status="declined"}[5m])) or vector(0)) / clamp_min(sum(rate(payment_charges_total[5m])) or vector(0), 1)'
    objective: "declined_rate < 1%"
    unit: ratio
  - kind: latency
    # duration is SECONDS into seconds-scaled buckets; quantile is in seconds,
    # NOT ms (mis-reading this is the ~4.75 constant artifact).
    promql: 'histogram_quantile(0.95, sum by (le) (rate(payment_charge_duration_seconds_bucket[5m])))'
    objective: "p95 < 0.2s"
    unit: s
  - kind: throughput
    promql: 'sum(rate(payment_charges_total[5m]))'
    unit: rps
logs:
  selector: '{service_name="payment-service"}'
  error_events: [payment.declined, payment.gateway_error]
  error_query: 'sum by (git_version, reason) (count_over_time({service_name="payment-service"} | event=~"payment.declined|payment.gateway_error" [5m]))'
  note: "Selector key is service_name (NOT service). event/reason are structured metadata — filter AFTER the selector with `| event=\"...\"`, never as a {...} selector. There is no level/ERROR line and no event=\"error\"."
exclusions:
  - "No up{} for application services (remote_write, not scraped); judge liveness via rate(payment_charges_total[5m]) > 0."
  - "A declined-rate spike ABOVE the objective is an incident, not normal business — do NOT dismiss declines as expected. Break it down with `sum by (git_version, reason) (rate(payment_charges_total{status=\"declined\"}[5m]))` to find which deploy/reason drives it (e.g. the new_validator flag shipping in a release)."
depends_on: []   # payment-service is a leaf
