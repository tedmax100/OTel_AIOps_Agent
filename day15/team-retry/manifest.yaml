name: payment-team
description: >-
  payment 團隊疊在 payments-base 0.2.0 之上。base 把 payment.retry_count 移除了，
  團隊仍然需要這個訊號，所以在自己這一層定義成 span event 上的 retry.* 欄位，
  而不是重新定義一個 base 已經拿掉的名字（見 Day8 第二個陷阱）。
schema_url: https://example.com/schemas/payment-team/0.1.0
dependencies:
  - schema_url: https://example.com/schemas/payments-base/0.2.0
    registry_path: day14/base-v2
