groups:
  - id: registry.payment
    type: attribute_group
    stability: development
    brief: "支付領域的共用屬性"
    attributes:
      # renamed: payment.id -> payment.transaction_id
      - id: payment.id
        type: string
        stability: development
        deprecated:
          reason: renamed
          renamed_to: payment.transaction_id
        brief: "支付交易識別碼"
        examples: ["pay-1001"]
      - id: payment.transaction_id
        type: string
        stability: development
        brief: "支付交易識別碼（改名後的正式欄位）"
        examples: ["pay-1001"]
      # updated: enum 多一個 member
      - id: payment.outcome
        type:
          members:
            - id: authorized
              value: authorized
              brief: "授權成功"
              stability: development
            - id: declined
              value: declined
              brief: "被拒絕"
              stability: development
            - id: pending_review
              value: pending_review
              brief: "轉人工審核"
              stability: development
        stability: development
        brief: "支付的終態結果"
      # obsoleted: 還在，但宣告不要再用
      - id: payment.gateway
        type: string
        stability: development
        deprecated:
          reason: obsoleted
          note: "金流商改由 server.address 表達，不再需要獨立欄位"
        brief: "處理這筆交易的金流商代號"
        examples: ["stripe"]
      # added
      - id: payment.method
        type: string
        stability: development
        brief: "支付方式"
        examples: ["credit_card"]
      # removed: payment.retry_count 整個消失（v1 有、v2 沒有）

  - id: event.payment.authorized
    type: event
    name: payment.authorized
    stability: development
    brief: "支付授權成功"
    attributes:
      - ref: payment.transaction_id
        requirement_level: required
      - ref: payment.outcome
        requirement_level: required
      - ref: payment.method
        requirement_level: recommended

  # added: 全新的 event
  - id: event.payment.refunded
    type: event
    name: payment.refunded
    stability: development
    brief: "退款完成"
    attributes:
      - ref: payment.transaction_id
        requirement_level: required
