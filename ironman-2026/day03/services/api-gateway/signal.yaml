# Signal declaration OWNED by api-gateway. Compiled into the agent's
# app/signals/{topology,contracts}.yaml by `python -m app.signals.compile`.
service: api-gateway
role: "thin proxy router to backend services"
tier: 1
journeys: [checkout]
git_version: v4.0.0
freshness_seconds: 60
supported_decisions: [rca]
slis: []          # no custom RED metrics; relies on auto HTTP + Loki
logs:
  selector: '{service_name="api-gateway"}'
  error_events: [http.request_failed]
  error_query: 'sum by (upstream, status) (count_over_time({service_name="api-gateway"} | event="http.request_failed" [5m]))'
  note: "http.request_failed carries upstream + status + reason. Selector key is service_name (NOT service); the `upstream` field points at the failing downstream."
exclusions:
  - "No custom application metrics: derive latency/throughput from the auto HTTP server histogram (discover_metrics for the exact name), and errors from Loki event=http.request_failed (carries upstream + status)."
  - "It's a thin proxy — a failure here is usually a *symptom* of a failing downstream (user/order/payment), not an api-gateway bug."
depends_on:
  - {callee: user-service}
  - {callee: order-service}
  - {callee: payment-service}
