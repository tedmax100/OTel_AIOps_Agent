apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Day3: this file is new. Everything below it (00-*.yaml ... 24-*.yaml) is
# unchanged from the CR migration earlier the same day — GitOps did not change
# what gets applied, only how.
#
# Before today: scripts/up.sh looped over k8s/[0-9]*-*.yaml and ran
# `kubectl apply -f` on each file, in numeric-prefix order, straight from a
# developer's laptop. There was no single artifact a reviewer could diff —
# "what changed" meant reading N separate file diffs and mentally
# reconstructing whether the *set* of applied resources still made sense
# together (e.g. did someone forget to bump the Instrumentation CR that
# api-gateway depends on when they added a new service?).
#
# After today: `kustomize build k8s/ | kubectl apply -f -` (or a GitOps
# controller like Argo CD / Flux pointed at this directory) produces one
# resolved manifest stream from one entry point. A PR that touches any file
# here shows up as a diff against that single resolved output, so a reviewer
# is looking at "what will actually change in the cluster", not "which files
# were touched".
resources:
  - 00-namespace.yaml
  - 10-prometheus.yaml
  - 11-loki.yaml
  - 12-tempo.yaml
  - 13-otel-collector.yaml
  - 14-grafana.yaml
  - 15-aiops-agent.yaml
  - 16-instrumentation.yaml
  - 20-payment-service.yaml
  - 21-user-service.yaml
  - 22-order-service.yaml
  - 23-api-gateway.yaml
  - 24-webapp.yaml

# commonLabels intentionally NOT used here even though kustomize supports it:
# it would stamp a label onto every resource including the Instrumentation
# CR and the five Deployments, which would silently change the
# `spec.selector.matchLabels` contract those Deployments already rely on
# (see 23-api-gateway.yaml's `git_version` pod label wired through the
# Downward API). Adding cluster-wide labels here is exactly the kind of
# "looks like a no-op" GitOps change the review checklist below calls out.
