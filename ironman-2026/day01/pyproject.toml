[project]
name = "aiops-day01"
version = "0.1.0"
description = "Day1 — the failure scene: a baseline RCA agent and the bench that scores it"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "typing-extensions>=4.12",
]

[tool.setuptools]
packages = ["agent", "bench"]
