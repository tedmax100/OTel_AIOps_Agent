# OTel Collector — receives OTLP from demo services, fans out to:
#   - Traces  → Tempo (OTLP)
#   - Metrics → Prometheus (remote write)
#   - Logs    → Loki (via loki exporter)
#
# Resource attrs git_repo / git_version / service.name are promoted to labels
# on the Loki/Prometheus side so LogQL/PromQL can filter and group on them.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Hoist resource attrs onto every log record so the Loki exporter can
  # surface them as labels.
  resource:
    attributes:
      - key: service
        from_attribute: service.name
        action: insert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    target_info:
      enabled: false
    resource_to_telemetry_conversion:
      enabled: true   # promote git_repo / git_version resource attrs to metric labels

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki]
