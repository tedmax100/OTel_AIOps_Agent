# Operator-managed Collector. Replaces the hand-written Deployment/Service/
# ConfigMap that used to live in this file (see git history) — the CR below
# is reconciled by the OTel Operator's controller instead of being a
# one-shot `kubectl apply`. See weaver-demo/ironman-2026/day03.md.
#
# The CR is named `otel` (not `otel-collector`) on purpose: the Operator
# names the Service it creates `<cr-name>-collector`, so naming the CR
# `otel` makes that Service resolve as `otel-collector` — every app
# manifest's OTEL_EXPORTER_OTLP_ENDPOINT already points at
# `otel-collector.demo.svc`, and this way none of them need to change.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: demo
spec:
  mode: deployment
  replicas: 1
  image: otel/opentelemetry-collector-contrib:0.111.0
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
      resource:
        attributes:
          - key: service
            from_attribute: service.name
            action: insert

    exporters:
      otlp/tempo:
        endpoint: tempo.demo.svc:4317
        tls:
          insecure: true

      prometheusremotewrite:
        endpoint: http://prometheus.demo.svc:9090/api/v1/write
        target_info:
          enabled: false
        resource_to_telemetry_conversion:
          enabled: true

      otlphttp/loki:
        endpoint: http://loki.demo.svc:3100/otlp
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/loki]
---
# Optional NodePort so xk6/k6 scripts running on the host can push directly
# to the collector. The Operator's own generated Service (`otel-collector`)
# is ClusterIP-only and its selector is Operator-managed — so this is a
# hand-written Service that targets the same pods via the labels the
# Operator stamps onto them, not `app: otel-collector` anymore.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-nodeport
  namespace: demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/instance: demo.otel
    app.kubernetes.io/component: opentelemetry-collector
  ports:
    - port: 4318
      targetPort: 4318
      nodePort: 30003
      name: otlp-http
