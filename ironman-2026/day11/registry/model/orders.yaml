groups:
  - id: registry.orders
    type: attribute_group
    stability: development
    brief: "訂單相關屬性"
    attributes:
      - id: biz.user.id
        type: string
        stability: development
        brief: "下單使用者的識別碼"
        examples: ["u-5"]
      - id: biz.order.id
        type: string
        stability: development
        brief: "訂單識別碼"
        examples: ["ord-1001"]
      - id: app.outcome
        stability: development
        brief: "這次業務操作的結果"
        annotations:
          intent:
            role: outcome_dimension
            good_values: [authorized]
        type:
          members:
            - id: authorized
              value: authorized
              brief: "成功"
              stability: development
            - id: declined
              value: declined
              brief: "被業務規則拒絕"
              stability: development
            - id: gateway_error
              value: gateway_error
              brief: "下游回錯"
              stability: development

  - id: metric.orders.attempts
    type: metric
    metric_name: orders.attempts
    instrument: counter
    unit: "{order}"
    stability: development
    brief: "下單嘗試次數"
    annotations:
      intent:
        owner: orders-team
        slo: checkout-success
    attributes:
      - ref: app.outcome
        requirement_level: required

  - id: metric.orders.duration
    type: metric
    metric_name: orders.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: "下單處理時間"
    attributes:
      - ref: app.outcome
