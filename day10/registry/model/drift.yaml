groups:
  - id: registry.order
    type: attribute_group
    stability: development
    brief: "訂單相關屬性——刻意保留命名漂移"
    attributes:
      # Day1 壞味道一：同一個概念，兩套命名並存
      - id: userId                 # 前端工程師照 JS 慣例寫的
        type: string
        stability: development
        brief: "下單使用者的識別碼（前端送進來的寫法）"
        examples: ["u-5"]
      - id: user_id                # 後端照 Python 慣例寫的
        type: string
        stability: development
        brief: "下單使用者的識別碼（後端內部的寫法）"
        examples: ["u-4"]

      # 沒有 namespace 的裸名字
      - id: status
        type: string
        stability: development
        brief: "訂單狀態"
        examples: ["created"]

      # 命名合規的對照組
      - id: biz.order.id
        type: string
        stability: development
        brief: "訂單識別碼"
        examples: ["ord-1001"]

  - id: span.order.create
    type: span
    span_kind: server
    stability: development
    brief: "建立訂單的 Span"
    attributes:
      - ref: userId
      - ref: user_id
      - ref: status
      - ref: biz.order.id
