[project]
name = "o11y-shared"
version = "0.1.0"
description = "Shared telemetry bootstrap, logging, and feature flags for demo services"
requires-python = ">=3.12"
dependencies = [
    # Zero-code instrumentation: distro pulls in API+SDK and the
    # `opentelemetry-instrument` / `opentelemetry-bootstrap` entrypoints.
    # exporter-otlp gives us the OTLP exporters for traces+metrics+logs.
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    # Auto-instrumentations. `opentelemetry-bootstrap -a install` would
    # discover and install these automatically, but in a uv-managed venv it
    # silently fails (no pip in the venv). Declaring them as direct deps
    # makes the build reproducible from uv.lock and survives uv sync alone.
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o11y_shared"]
